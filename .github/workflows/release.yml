on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Assets

permissions:
  # softprops/action-gh-release creates the draft release and
  # uploads the archives with the workflow token.
  contents: write

jobs:
  build:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Get the version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: pdo_sqlite, zip, gd
      - name: Install PHP dependencies
        uses: ramsey/composer-install@1919f6c305aea6ab10e6181a8ddf72317ad77e0e # 2.3.1
        with:
          composer-options: "--prefer-dist --no-dev --optimize-autoloader"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Build project
        run: |
          sudo apt install pngquant zip unzip
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's|^DB_DATABASE=.*$|DB_DATABASE=:memory:|' .env
          php artisan koel:init --no-interaction
      - name: Create archives
        run: |
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=sqlite-persistent/' .env
          sed -i 's|^DB_DATABASE=.*$|DB_DATABASE=koel.db|' .env
          rm -rf .git ./node_modules ./storage/search-indexes/*.index ./koel.db ./.env
          cd ../
          zip -r /tmp/koel-${{ steps.get_version.outputs.VERSION }}.zip koel/
          tar -zcf /tmp/koel-${{ steps.get_version.outputs.VERSION }}.tar.gz koel/
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: false
          files: |
            /tmp/koel-${{ steps.get_version.outputs.VERSION }}.zip
            /tmp/koel-${{ steps.get_version.outputs.VERSION }}.tar.gz
